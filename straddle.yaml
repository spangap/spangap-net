# spangap-net — IP networking + TLS + NTP + mDNS.
#
# Pulled in by any straddle that needs WiFi/TCP/UDP — RNS-over-TCP,
# AutoInterface UDP-multicast, HTTPS server, OTA, ACME, etc. A LoRa- or
# ESPNOW-only node skips this entirely. Owns its own frontends: the on-device
# WiFi, mDNS and System settings (the settings: block below), which the build
# lowers to both surfaces.
schema_version: 1
name: spangap/spangap-net
prefix: net
version: 0.0.0
firmware: esp-idf
platforms: [idf]
# spangap-core is implicit (the empty-prefix platform foundation) — not listed.
# Remote-access services ride on the IP stack: anything that pulls in net gets
# ACME / UPnP / WireGuard / DuckDNS / sshd staged by default (each hard-requires
# net anyway). They carry their own when:-gated init hooks plus a browser_register
# hook, so a build that drops one with `spangap build --without spangap/<name>`
# compiles AND un-bundles its UI cleanly. (Every settings pane this straddle
# owns is declarative, so it rides on whoever staged lcd, not on a net install.)
additional_installs:
  - spangap/acme
  - spangap/upnp
  - spangap/wg
  - spangap/duckdns
  - spangap/sshd
# Auto-init: the net foundation is brought up in the generated serviceRunInit()
# walk. net registers in the platform band (right after core, see spangap-inside
# PLATFORM_ORDER), so the IP stack is up before every service/app straddle —
# they need not order themselves against it. These four fire in listed order:
# TLS, then the netif/WiFi, then NTP (which ends by applying the persisted
# timezone, so logs switch UTC→local from here), then mDNS.
init:
  - call: tlsInit
  - call: netInit
  - call: ntpInit
  - call: mdnsInit
  # Mono-OLED status page (hostname.local, STA IP, AP SSID/IP); lives in
  # conditional/tinylcd/.
  - call: netTinylcdRegister
    when: spangap/tinylcd

# Declarative settings (lowered to both surfaces + storage defaults by the
# build). WiFi included: the known networks are a collection, net.cpp owns every
# mutation through the wifi.net.* sentinels and validates there, and the scan is
# a candidates clause — so the scan dialog, the array rewriting and the
# per-keystroke checks the old panel carried are all gone.
settings:
  - at:
      # spangap-net names the top-level network menu — every other straddle
      # contributing there states the bare `id: net`.
      - { id: net, label: "WiFi & Network", short: "Network", order: 10 }
      - { id: wifi, label: "WiFi", short: "WiFi", order: 1 }
    rows:
      - title: "WiFi"
      - heading: "Getting connected"
      - switch: { label: "Enable WiFi", key: "s.net.wifi.enable" }
      # Every row here is a string net.cpp publishes finished — the state and
      # the signal quality in words, the traffic pair as one line.
      - info:
          rows:
            - value: { label: "Status", key: "wifi.sta.state_text" }
            - value: { label: "SSID", key: "wifi.sta.ssid" }
              when_key: wifi.sta.up
            - value: { label: "IP", key: "wifi.sta.ip", copyable: true }
              when_key: wifi.sta.up
            - value: { label: "Router", key: "wifi.sta.router" }
              when_key: wifi.sta.up
            - value: { label: "Netmask", key: "wifi.sta.netmask" }
              when_key: wifi.sta.up
            - value: { label: "DNS", key: "wifi.sta.dns" }
              when_key: wifi.sta.up
            # IPv6 is SLAAC + link-local only — nothing to configure, so the
            # v6 surface is these two readouts. Gated on the value itself:
            # the row appears once the address exists.
            - value: { label: "IPv6", key: "wifi.sta.ip6", copyable: true }
              when_key: wifi.sta.ip6
            - value: { label: "IPv6 link-local", key: "wifi.sta.ip6_ll", copyable: true }
              when_key: wifi.sta.ip6_ll
            - value: { label: "MAC", key: "wifi.mac", copyable: true }
            - value: { label: "Signal", key: "wifi.sta.signal" }
              when_key: wifi.sta.up
            - value: { label: "Traffic", key: "wifi.traffic" }
              when_key: wifi.sta.up
      - list:
          label: "Known networks"
          caption: "Networks this device will try connecting to when it sees them. Drag them in the order you want in case multiple of these networks might be visible at the same time."
          key: s.net.wifi.nets
          id: id
          item: "{ssid}"
          # net.cpp publishes the pill for each known network — which one is
          # connected and which are merely in range is something only it knows.
          status: "wifi.netstat.{id}"
          empty: "No networks configured."
          reorder: true
          cmd: wifi.net
          add:
            - label: "Add manually"
              form:
                title: "Add network"
                submit: "Add"
                fields:
                  - text: { label: "Network name", field: ssid }
                  - text: { label: "Password", field: pass, secret: true, placeholder: "leave empty if open" }
          remove: { confirm: "Forget {ssid}?" }
          # Joining is worth offering on every known network except the one we
          # are already on; net.cpp publishes that as a gate rather than the
          # surfaces comparing the connected SSID against the item.
          actions:
            - label: "Connect"
              when_key: "wifi.netjoinable.{id}"
              do: { set: { key: "wifi.net.connect", value: "{id}" } }
          # The item's detail page. Opened by tapping the row, and it carries the
          # Connect and Delete buttons too, so the row itself is just the network.
          # The SSID names the page rather than sitting on it — both surfaces
          # head an editor with the `item:` template above, so there is no row
          # for it here. A field left out of `edit:` is not edited — net.cpp
          # carries it forward on `.set` — so leaving it out is how a detail
          # page says "not this".
          edit:
            - text:   { label: "Password", field: pass, secret: true }
            - ipv4: { label: "IP", field: ip, placeholder: "DHCP" }
            - ipv4: { label: "Netmask", field: mask, default: "255.255.255.0" }
              when_key: "{ip}"
            - ipv4: { label: "Gateway", field: gw }
              when_key: "{ip}"
            - ipv4: { label: "DNS server", field: dns }
              when_key: "{ip}"
            # The hint is the MAC this device would actually use, which only the
            # firmware knows — hence the key rather than a literal.
            - text: { label: "MAC", field: mac, placeholder_key: "wifi.mac" }
          # Scan-and-adopt. net.cpp renders each result's two lines (name, and
          # bars + dBm + lock marker) so neither surface draws signal strength.
          candidates:
            key: wifi.scanned
            item: "{name}"
            subtitle: "{detail}"
            found: "Found networks"
            refresh: { label: "Scan for networks", do: { set: { key: "wifi.scan", value: "1", edge: true } } }
      - heading: "Access point"
      - switch: { label: "Enable fallback AP", key: "s.net.wifi.ap.enable", default: 1 }
      - caption: "This device becomes a WiFi access point when no known networks are found."
      # The timeout is a one-shot idle window per boot, so the interesting
      # values are its neighbours rather than the whole range — hence the
      # steppers, and a step that walks in five-minute rests.
      - integer: { label: "Inactivity timeout", unit: "min", key: "s.net.wifi.ap.timeout",
                   min: 0, max: 300, step: 5, buttons: true, default: 10 }
        when_key: wifi.ap.enabled
      - caption: "Setting this to 0 keeps the AP up until a known network appears, otherwise AP shuts down after this many minutes."
        when_key: wifi.ap.enabled
      - text: { label: "SSID", key: "s.net.wifi.ap.ssid" }
        when_key: wifi.ap.enabled
      - text: { label: "Password", key: "s.net.wifi.ap.pass" }
        when_key: wifi.ap.enabled
      - ipv4: { label: "IP", key: "s.net.wifi.ap.ip" }
        when_key: wifi.ap.enabled
      - ipv4: { label: "Netmask", key: "s.net.wifi.ap.mask" }
        when_key: wifi.ap.enabled
      - value: { label: "AP address", key: "wifi.ap.ip", copyable: true }
        when_key: wifi.ap.up
      # mDNS is how this device is found ON the local network, so it belongs at
      # the foot of the WiFi pane rather than in a menu of its own.
      - heading: "mDNS"
      - caption: "This is the service that answers when anything on the local network is looking for <hostname>.local"
      - switch: { label: "Enable mDNS", key: "s.net.mdns_enable", default: 1 }
  # Reachability from OUTSIDE the local network. spangap-net owns the node and
  # names it; the straddles that answer the question — upnp, duckdns, acme,
  # wg — state the bare `id: reachable` and each contributes one heading group,
  # ordered on their contributions rather than on init order.
  - at:
      - { id: net }
      - { id: reachable, label: "Reachable from the internet", short: "Reachable", order: 2 }
    order: 1
    rows:
      - title: "Reachable from the internet"
  # System pane (top-level). Rows are defaultless: hostname/tz/server defaults
  # live in the s.net / s.ntp storageDefaultTree (net.cpp / ntp.cpp).
  - at:
      - { id: system }
    rows:
      - section: "This system"
      - text: { label: "Hostname", key: "s.net.hostname" }
      - section: "Time & date"
      # The zone list is too long to be a static option list, so the picker is
      # the optionless `timezone:` field: each surface brings its own list
      # (the browser its Intl database, the LCD the firmware's built-in zone
      # table). The form still submits the name through ntp.tz.set and
      # ntp.cpp checks it resolves against that table before storing it — a
      # miss comes back as a sentence rather than being silently accepted.
      - value: { label: "Timezone", key: "s.ntp.tz" }
      - button:
          label: "Set timezone"
          do:
            form:
              title: "Set timezone"
              submit: "Set"
              cmd: ntp.tz.set
              fields:
                - timezone: { label: "Timezone", field: tz, placeholder_key: "s.ntp.tz" }
      - text: { label: "NTP Server", key: "s.ntp.server" }
      - value: { label: "Last NTP sync", key: "ntp.last_sync" }
      # Edge write: the sentinel clears itself after handling, but a press
      # that raced an earlier one must still register as a change.
      - button:
          label: "Sync time now"
          do:
            set: { key: "ntp.sync.now", value: "1", edge: true }
